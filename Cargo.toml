[package]
name = "matching-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1", features = ["full"]}
serde = { version = "1.0", features = ["derive"] }
axum = "0.7"
redis = { version = "0.25", features = ["tokio-comp"] }
uuid = { version = "1", features = ["v4", "serde"]}
serde_json = "1"
futures-util = "0.3.32"
