name: exchange

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/exchange
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET}
    ADMIN_ACCOUNT_ID: ${ADMIN_ACCOUNT_ID:-1}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: exchange
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exchange"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis is the durable command log here, not a cache — appendonly matters.
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  # Single-threaded and owns all state, so exactly one replica. Snapshots to a
  # volume so a restart doesn't replay the whole command log.
  engine:
    <<: *app
    command: ["engine"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/exchange
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_ACCOUNT_ID: ${ADMIN_ACCOUNT_ID:-1}
      ENGINE_SNAPSHOT_PATH: /var/lib/exchange/engine.json
      ENGINE_SNAPSHOT_EVERY: ${ENGINE_SNAPSHOT_EVERY:-5000}
    volumes:
      - snapshots:/var/lib/exchange
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db_writer:
    <<: *app
    command: ["db_writer"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/exchange
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_ACCOUNT_ID: ${ADMIN_ACCOUNT_ID:-1}
      # 0 keeps rows forever
      ORDER_RETENTION_DAYS: ${ORDER_RETENTION_DAYS:-7}
      TRADE_RETENTION_DAYS: ${TRADE_RETENTION_DAYS:-365}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    command: ["api"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/exchange
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_ACCOUNT_ID: ${ADMIN_ACCOUNT_ID:-1}
      BIND_ADDR: 0.0.0.0:3000
      BOOK_SNAPSHOT_PATH: /var/lib/exchange/book.json
      BOOK_SNAPSHOT_EVERY: ${BOOK_SNAPSHOT_EVERY:-5000}
    volumes:
      - snapshots:/var/lib/exchange
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Keeps the book and the tape moving so the demo isn't a dead market.
  bot:
    <<: *app
    command: ["bot"]
    environment:
      API_BASE: http://api:3000
      BOT_PAIR: ${BOT_PAIR:-SOL-USD}
      BOT_TICK_MS: ${BOT_TICK_MS:-4000}
      BOT_PASSWORD: ${BOT_PASSWORD}
      ADMIN_ACCOUNT_ID: ${ADMIN_ACCOUNT_ID:-1}
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FRONTEND_DIST:-../../fe/dist}:/srv:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  snapshots:
  caddydata:
  caddyconfig:
